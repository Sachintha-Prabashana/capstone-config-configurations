spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:12500/eca
    username: postgres
    password: Sachintha@2003
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

servlet:
  multipart:
    enabled: true
    max-file-size: 5MB
    max-request-size: 10MB

server:
  port: 0
  forward-headers-strategy: framework

eureka:
  instance:
    # using Service Name and Random UUID to create a unique Instance ID - for port is dynamic ( it means port = 0 )
    instance-id: ${spring.application.name}:${random.value}

app:
  storage:
    path: ${user.home}/.ijse/eca/students